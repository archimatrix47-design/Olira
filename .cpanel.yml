# cPanel Git Version Control - deployment tasks
#
# Runs on the server when you click "Deploy HEAD Commit" in
# cPanel > Git Version Control > Manage, from the checkout being deployed.
#
# scripts/deploy.sh does the work: it copies the checkout into its Node app,
# installs, builds from that app's data folder, restarts the app and (for the
# live site only) pings IndexNow. The checkout's branch decides where it goes:
#   main    (~/repositories/Olira)          -> ~/olira          the live site
#   staging (~/repositories/Olira-staging)  -> ~/olira-staging  the staging copy
# so deploying the staging checkout can never overwrite the live site.
#
# Check a checkout without changing anything, in Terminal:
#   cd ~/repositories/Olira && DEPLOY_DRY=1 sh scripts/deploy.sh
deployment:
  tasks:
    - export DEPLOY_HOME=/home/oliraagr
    # Must match the Node version selected in cPanel > Setup Node.js App (both apps).
    - export NODEVER=20
    - /bin/sh scripts/deploy.sh "$PWD"
