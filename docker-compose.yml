services:
  olira-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olira-website
    ports:
      # External 3004 → internal 5000. Cloudflare Tunnel points to localhost:3004.
      - "3004:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Olira Agro Industry}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL:-info@oliraagroindustry.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://oliraagroindustry.com,https://www.oliraagroindustry.com}
    volumes:
      # Persist admin-edited data + audit log across container rebuilds.
      - ./data:/app/data
      # Persist admin-uploaded files (logos, product photos) across rebuilds.
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
