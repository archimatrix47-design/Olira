<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxes and wiring, Olira</title>
<style>
  :root { --bg: #f5f5f4; --card: #fff; --ink: #1c1b19; --ink-2: #5d5a55; --line: rgba(0,0,0,.12); --accent: #186078; --accent-soft: rgba(24,96,120,.12); --from: #8a4b12; --from-soft: rgba(138,75,18,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg: #111110; --card: #1c1b1a; --ink: #f2f1ee; --ink-2: #aca8a1; --line: rgba(255,255,255,.14); --accent: #6cc0dc; --accent-soft: rgba(108,192,220,.16); --from: #e4a768; --from-soft: rgba(228,167,104,.16); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 24px 24px 8px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0 0 12px; color: var(--ink-2); max-width: 70ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  input[type=search] { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: min(340px, 100%); }
  .key { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
  .key i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 24px; padding: 8px 24px 48px; position: relative; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 8px 16px 40px; } header { padding: 20px 16px 8px; } #detail { position: static; max-height: none; } }
  h2 { font-size: .8rem; letter-spacing: .03em; color: var(--ink-2); margin: 20px 0 8px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .box { font: inherit; color: inherit; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 64px; cursor: pointer; position: relative; z-index: 1; }
  .box b { display: block; font-weight: 600; font-size: .92rem; }
  .box span { color: var(--ink-2); font-size: .78rem; }
  .box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .box.is-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .box.is-uses { background: var(--accent-soft); border-color: var(--accent); }
  .box.is-usedby { background: var(--from-soft); border-color: var(--from); }
  .box.is-dim { opacity: .38; }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  #detail { position: sticky; top: 16px; align-self: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; max-height: calc(100vh - 32px); overflow: auto; z-index: 3; }
  #detail h3 { margin: 0 0 2px; font-size: 1.15rem; }
  #detail .id { color: var(--ink-2); font-size: .82rem; margin: 0 0 8px; }
  #detail p { margin: 0 0 10px; }
  #detail h4 { margin: 14px 0 4px; font-size: .78rem; color: var(--ink-2); font-weight: 600; }
  #detail ul { margin: 0; padding: 0; list-style: none; font-size: .84rem; overflow-wrap: anywhere; }
  #detail li { padding: 2px 0; }
  .link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; min-height: 24px; }
  code { font: .8rem ui-monospace, SFMono-Regular, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>Boxes and wiring</h1>
  <p>Each box is one function of the site. Choose a box to see what it does, what it is wired to, and which files, routes and data are inside it. Generated from <code>boxes/parts/</code> and the running app by <code>npm run boxes</code>.</p>
  <div class="tools">
    <label><span style="position:absolute;left:-9999px">Find a box, file or route</span><input type="search" id="find" placeholder="Find a box, file or route"></label>
    <div class="key"><span><i style="background:var(--accent)"></i>it uses</span><span><i style="background:var(--from)"></i>uses it</span></div>
  </div>
</header>
<main id="main">
  <svg id="wires" aria-hidden="true"></svg>
  <div id="list"></div>
  <aside id="detail" aria-live="polite"><p>Choose a box.</p></aside>
</main>
<script>
const W = /*__WIRING__*/null;
const ids = Object.keys(W.boxes), list = document.getElementById('list'), detail = document.getElementById('detail'), svg = document.getElementById('wires'), main = document.getElementById('main');
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) k === 'class' ? (e.className = v) : e.setAttribute(k, v); e.append(...kids); return e; };
const cards = new Map();
for (const [kind, title] of Object.entries(W.kinds)) {
  const mine = ids.filter((id) => W.boxes[id].kind === kind);
  if (!mine.length) continue;
  const grid = el('div', { class: 'grid' });
  for (const id of mine) {
    const b = W.boxes[id];
    const c = el('button', { class: 'box', type: 'button', 'aria-pressed': 'false' }, el('b', {}, b.name), el('span', {}, `${b.files.length} file${b.files.length === 1 ? '' : 's'}${b.routes.length ? `, ${b.routes.length} route${b.routes.length === 1 ? '' : 's'}` : ''}`));
    c.addEventListener('click', () => pick(id));
    cards.set(id, c); grid.append(c);
  }
  list.append(el('h2', {}, title), grid);
}
let current = null;
function section(title, items) {
  if (!items.length) return [];
  return [el('h4', {}, title), el('ul', {}, ...items.map((x) => el('li', {}, x)))];
}
const jump = (id) => { const b = el('button', { class: 'link', type: 'button' }, W.boxes[id]?.name || id); b.addEventListener('click', () => pick(id)); return b; };
function pick(id) {
  current = id;
  const b = W.boxes[id];
  for (const [k, c] of cards) {
    c.classList.toggle('is-on', k === id); c.setAttribute('aria-pressed', String(k === id));
    c.classList.toggle('is-uses', b.uses.includes(k)); c.classList.toggle('is-usedby', b.usedBy.includes(k));
    c.classList.toggle('is-dim', k !== id && !b.uses.includes(k) && !b.usedBy.includes(k));
  }
  detail.replaceChildren(el('h3', {}, b.name), el('p', { class: 'id' }, id), el('p', {}, b.does),
    ...section('It uses', b.uses.map(jump)), ...section('Used by', b.usedBy.map(jump)),
    ...section('Wires it is given', b.receives.map((r) => { const li = el('span', {}, el('code', {}, r.name)); if (r.from) li.append(' from ', jump(r.from), r.late ? ' (once running)' : ''); return li; })),
    ...section('What it offers', b.offers.map((o) => el('code', {}, o))),
    ...section('Routes', b.routes.map((r) => el('code', {}, r))),
    ...section('Server routes its screens call', Object.entries(b.calls).flatMap(([k, urls]) => urls.map((u) => { const s = el('span', {}, el('code', {}, u), ' in '); s.append(jump(k)); return s; }))),
    ...section('Events it sends', b.sends.map((e) => el('code', {}, e))), ...section('Events it listens for', b.hears.map((e) => el('code', {}, e))),
    ...section('Data it owns', b.data.map((d) => el('code', {}, d))), ...section('Data it only reads', b.reads.map((d) => el('code', {}, d))),
    ...section('Files', b.files.map((f) => el('code', {}, f))), ...section('Proof', [...b.tests.map((f) => el('code', {}, f)), ...(b.checkedBy ? [b.checkedBy] : [])]));
  detail.scrollTop = 0;
  draw();
  try { history.replaceState(null, '', `#${id}`); } catch (e) { /* opened from a file */ }
}
function draw() {
  svg.replaceChildren();
  if (!current || innerWidth <= 860) return;
  const box = main.getBoundingClientRect(), from = cards.get(current).getBoundingClientRect();
  const x1 = from.left - box.left + from.width / 2, y1 = from.top - box.top + from.height / 2;
  const line = (id, colour) => {
    const c = cards.get(id); if (!c) return;
    const r = c.getBoundingClientRect(), x2 = r.left - box.left + r.width / 2, y2 = r.top - box.top + r.height / 2;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`);
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', colour); p.setAttribute('stroke-width', '1.4'); p.setAttribute('opacity', '.7');
    svg.append(p);
  };
  const css = getComputedStyle(document.documentElement);
  W.boxes[current].uses.forEach((id) => line(id, css.getPropertyValue('--accent')));
  W.boxes[current].usedBy.forEach((id) => line(id, css.getPropertyValue('--from')));
}
addEventListener('resize', draw);
document.getElementById('find').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const [id, c] of cards) { const b = W.boxes[id]; c.style.display = !q || [id, b.name, b.does, ...b.files, ...b.routes, ...b.data].join(' ').toLowerCase().includes(q) ? '' : 'none'; }
  draw();
});
const start = location.hash.slice(1);
if (W.boxes[start]) pick(start);
</script>
</body>
</html>
