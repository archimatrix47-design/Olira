<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" aria-hidden="true">
  <!-- Spice leaf — bold palmate silhouette + scattered seeds -->
  <g transform="translate(200 200)">
    <!-- stem -->
    <path d="M 0 -150 L 0 150" stroke="#21341a" stroke-width="3" stroke-linecap="round"/>
    <!-- 3 leaflet pairs (palmate) -->
    <path d="M 0 -130 C -55 -125 -75 -90 -70 -55 C -30 -55 -5 -85 0 -110 Z" fill="#76944c" stroke="#21341a" stroke-width="2"/>
    <path d="M 0 -130 C 55 -125 75 -90 70 -55 C 30 -55 5 -85 0 -110 Z" fill="#76944c" stroke="#21341a" stroke-width="2"/>
    <path d="M 0 -50 C -75 -40 -100 0 -90 50 C -40 50 -5 5 0 -25 Z" fill="#a3c074" stroke="#21341a" stroke-width="2"/>
    <path d="M 0 -50 C 75 -40 100 0 90 50 C 40 50 5 5 0 -25 Z" fill="#a3c074" stroke="#21341a" stroke-width="2"/>
    <path d="M 0 30 C -65 40 -85 80 -75 120 C -30 120 -5 80 0 55 Z" fill="#76944c" stroke="#21341a" stroke-width="2"/>
    <path d="M 0 30 C 65 40 85 80 75 120 C 30 120 5 80 0 55 Z" fill="#76944c" stroke="#21341a" stroke-width="2"/>
  </g>
  <!-- scattered seeds -->
  <g fill="#39572f">
    <ellipse cx="100" cy="80" rx="5" ry="3" transform="rotate(-20 100 80)"/>
    <ellipse cx="320" cy="100" rx="5" ry="3" transform="rotate(15 320 100)"/>
    <ellipse cx="80" cy="320" rx="5" ry="3" transform="rotate(30 80 320)"/>
    <ellipse cx="330" cy="330" rx="5" ry="3" transform="rotate(-25 330 330)"/>
    <ellipse cx="60" cy="200" rx="5" ry="3" transform="rotate(0 60 200)"/>
  </g>
</svg>
